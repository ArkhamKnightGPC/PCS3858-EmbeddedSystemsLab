<section class="card">
    <h2>Attitude Indicator (Attitude Gauge)</h2>
    <div style="position: relative; width: 220px; height: 220px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 4px solid #333; background: #68b2d8;">
        <!-- Sky / Ground Horizon Layer -->
        <div id="horizon-sky-ground" style="position: absolute; top: -110px; left: -110px; width: 440px; height: 440px; transition: transform 0.2s ease-out;">
            <div style="width: 100%; height: 50%; background-color: #3b82f6;"></div> <!-- Sky -->
            <div style="width: 100%; height: 50%; background-color: #855223; border-top: 2px solid white;"></div> <!-- Ground -->
        </div>

        <!-- Static Aircraft Crosshair Overlay -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 100 100">
            <!-- Center Dot and Wings -->
            <circle cx="50" cy="50" r="3" fill="#fbbf24" />
            <line x1="20" y1="50" x2="40" y2="50" stroke="#fbbf24" stroke-width="3" />
            <line x1="60" y1="50" x2="80" y2="50" stroke="#fbbf24" stroke-width="3" />
            <line x1="40" y1="50" x2="40" y2="55" stroke="#fbbf24" stroke-width="3" />
            <line x1="60" y1="50" x2="60" y2="55" stroke="#fbbf24" stroke-width="3" />
        </svg>
    </div>

    <!-- Telemetry Readouts -->
    <div class="metrics-row" style="margin-top: 15px;">
        <div class="metric-block">
            <span class="metric-label">Pitch</span>
            <span id="pitch-val" class="metric">--</span>
            <span class="unit">°</span>
        </div>
        <div class="metric-block">
            <span class="metric-label">Roll</span>
            <span id="roll-val" class="metric">--</span>
            <span class="unit">°</span>
        </div>
        <div class="metric-block">
            <span class="metric-label">G-Force</span>
            <span id="g-val" class="metric">--</span>
            <span class="unit">g</span>
        </div>
    </div>
</section>
